<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Addata bridge</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #1f2937; background: transparent; }
  .box { padding: 6px 4px; }
  button { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid #94a3b8; background: #f8fafc; cursor: pointer; }
  button:hover { background: #e2e8f0; }
  button:disabled { opacity: .5; cursor: default; }
  .st { margin-top: 6px; line-height: 1.5; white-space: pre-wrap; }
  .ok { color: #166534; } .ng { color: #b91c1c; } .busy { color: #92400e; }
</style>
</head>
<body>
<div class="box">
  <button id="pick">📂 PC の Addata フォルダを選ぶ（C:\Addata）</button>
  <div class="st" id="st">未接続。ボタンを押して、PC の Addata フォルダ（COM フォルダがあるもの）を選んでください。
選んだフォルダから、車種マスタ（COM、約 9MB）と、見積の車種フォルダ（数 MB）だけをこの画面のアプリに送ります。</div>
</div>
<script>
// Streamlit のコンポーネント規約（streamlit-component-lib と同じ postMessage）を素の JS で実装する。
// - 親 → iframe: {type:'streamlit:render', args:{want, have, com}}
// - iframe → 親: componentReady / setComponentValue / setFrameHeight
// ブラウザの File System Access API（Chrome / Edge）で PC のフォルダを開き、必要なファイルだけを base64 で送る。
// サーバ側（クラウド）は PC を直接読めないので、これが「アプリが PC の Addata を見に行く」唯一の経路。
(function () {
  const stEl = document.getElementById('st');
  const btn = document.getElementById('pick');
  let dirHandle = null;      // 選んだ Addata フォルダ
  let seq = 0;               // 送信ごとに増やす（Python 側で同じ値の二重処理を避ける）
  const NONCE = Math.random().toString(36).slice(2, 10);   // この iframe の印。読み直すと変わる（接続解除後の古い値と区別する。Codex 47）
  let sending = false;
  let sentCom = false;
  const sentCars = new Set();
  let lastArgs = {want: '', have: [], com: false};

  // ── このPC・このブラウザの覚え ──────────────────────────────
  // 画面を読み直すと、選んだフォルダ（File System Access API の handle）も、送り先のフォルダ名も消える。
  // handle は IndexedDB に、送り先のフォルダ名と設定は localStorage に覚えて、次に開いたときに使う。
  const LS_BID = 'neo_addata_bridge_id', LS_NAME = 'neo_addata_root_name';
  const IDB_NAME = 'neo_addata', IDB_STORE = 'handles';
  let helloSent = false, needPerm = false;
  let savedBid = '';          // 起動時に読む（親から来る新しい bid で上書きされる前に控える）

  function lsGet(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) window.localStorage.setItem(k, v); else window.localStorage.removeItem(k); } catch (e) {} }

  function idb() {
    return new Promise(function (res, rej) {
      let r;
      try { r = window.indexedDB.open(IDB_NAME, 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = function () { const db = r.result; if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  async function idbPut(key, val) {
    try {
      const db = await idb();
      await new Promise(function (res, rej) {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    } catch (e) {}
  }
  async function idbGet(key) {
    try {
      const db = await idb();
      return await new Promise(function (res, rej) {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const q = tx.objectStore(IDB_STORE).get(key);
        q.onsuccess = function () { res(q.result || null); };
        q.onerror = function () { rej(q.error); };
      });
    } catch (e) { return null; }
  }
  async function forgetAll() {
    lsSet(LS_BID, ''); lsSet(LS_NAME, '');
    await idbPut('dir', null);
    dirHandle = null; needPerm = false; sentCom = false; sentCars.clear();
    btn.textContent = '📂 PC の Addata フォルダを選ぶ（C:\\Addata）';
  }

  function post(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), '*');
  }
  function setHeight() { post('streamlit:setFrameHeight', {height: document.body.scrollHeight + 8}); }
  function status(text, cls) { stEl.textContent = text; stEl.className = 'st ' + (cls || ''); setHeight(); }
  function send(value) { seq += 1; value.seq = seq; value.nonce = NONCE; post('streamlit:setComponentValue', {value: value, dataType: 'json'}); }

  function whyText(e, what) {
    // NotFoundError = フォルダやファイルが無い。それ以外（NotReadableError・NotAllowedError 等）は読めない ＝ コグニセブンが
    // 開いていてファイルを掴んでいる、権限が無い、など。原因ごとに次にやることを書く
    const name = (e && e.name) || '';
    if (name === 'Error' && e.message) return e.message;   // 上限（大きさ・数）のエラーは理由そのもの
    if (name === 'NotFoundError') return `${what}がありません`;
    if (name === 'NotAllowedError' || name === 'SecurityError') return `${what}を読む許可がありません（ダイアログで「ファイルを表示」を許可してください）`;
    return `${what}を読めませんでした（コグニセブンが開いているとファイルを掴んで読めないことがあります。閉じてからもう一度選んでください）: ` + name;
  }
  // Python 側（neo_skill/bridge.py）と同じ上限。読む前にファイルの大きさ・種類で弾く（巨大なファイルを丸ごと読んで
  // base64 にしてから送ると、ブラウザと共有サーバのメモリを食い潰す。Codex hunt D3 2026-09-15）
  const MAX_FILE_BYTES = 32 * 1024 * 1024, MAX_MESSAGE_BYTES = 128 * 1024 * 1024, MAX_FILES = 400;
  const ALLOWED_EXT = /\.(db|cab|chm|txt)$/i;
  async function readFile(f) {
    const buf = await f.arrayBuffer();
    // base64（大きなファイルでも呼び出しスタックを溢れさせない）
    const bytes = new Uint8Array(buf);
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return {b64: btoa(bin), size: bytes.length};
  }

  async function collect(dir, prefix, skipRe) {
    const files = {};
    let total = 0;
    let count = 0;
    for await (const [name, h] of dir.entries()) {
      if (h.kind !== 'file') continue;
      if (skipRe && skipRe.test(name)) continue;
      if (!ALLOWED_EXT.test(name) && name.includes('.')) continue;   // desktop.ini 等は読まない（拡張子なしの COM/AdVer は Python 側と同じく許す）
      const f = await h.getFile();
      if (f.size > MAX_FILE_BYTES) throw new Error(`${name} が大きすぎます（${(f.size / 1048576).toFixed(0)}MB。上限 32MB）`);
      if (total + f.size > MAX_MESSAGE_BYTES) throw new Error(`${prefix} の合計が上限（128MB）を超えます`);
      if (++count > MAX_FILES) throw new Error(`${prefix} のファイル数が上限（${MAX_FILES}）を超えます`);
      const r = await readFile(f);
      files[prefix + '/' + name] = r.b64;
      total += r.size;
    }
    return {files: files, total: total};
  }

  async function sendCom() {
    if (!dirHandle || sending) return;
    sending = true;
    try {
      const com = await dirHandle.getDirectoryHandle('COM');
      status('COM（車種マスタ）を読んでいます…', 'busy');
      const c = await collect(com, 'COM', null);
      status(`COM を送っています（${Object.keys(c.files).length} ファイル・${(c.total / 1048576).toFixed(1)}MB）…`, 'busy');
      send({phase: 'com', root_name: dirHandle.name, files: c.files, bytes: c.total});
      sentCom = true;
    } catch (e) {
      // アプリ側にも知らせる: 前に送った Addata を消して「未接続」に戻す（古い Addata のまま黙って作らない。Codex 46）
      sentCom = false; sentCars.clear();
      const why = whyText(e, `選んだフォルダ（${dirHandle ? dirHandle.name : ''}）の COM フォルダ`);
      send({phase: 'com', root_name: dirHandle ? dirHandle.name : '', files: {}, bytes: 0,
            error: why + '。Addata の直下（A〜Z のフォルダと COM がある場所）を選んでください: ' + e});
      status(why + '。Addata の直下（A〜Z のフォルダと COM がある場所）を選んでください。', 'ng');
    } finally { sending = false; }
  }

  async function sendCar(car) {
    if (!dirHandle || sending || !car) return;
    sending = true;
    try {
      const letter = car[0];
      const d1 = await dirHandle.getDirectoryHandle(letter);
      const d2 = await d1.getDirectoryHandle(car);
      status(`車種 ${car} のフォルダを読んでいます…`, 'busy');
      const c = await collect(d2, letter + '/' + car, /IMG\.CAB$/i);   // 部品画像の CAB は要らない
      status(`車種 ${car} を送っています（${Object.keys(c.files).length} ファイル・${(c.total / 1048576).toFixed(1)}MB）…`, 'busy');
      send({phase: 'car', car: car, root_name: dirHandle.name, files: c.files, bytes: c.total});
      sentCars.add(car);
    } catch (e) {
      sentCars.add(car);   // 同じ車種の error を render のたびに送り直さない（フォルダを選び直せば clear される）
      const why = whyText(e, `車種 ${car} のフォルダ（${car[0]}/${car}）`);
      send({phase: 'car', car: car, root_name: dirHandle ? dirHandle.name : '', files: {}, bytes: 0,
            error: why + '（PC の Addata）: ' + e});
      status(why + (e && e.name === 'NotFoundError' ? '。Addata の版が古いか、車種コードが違います。' : ''), 'ng');
    } finally { sending = false; }
  }

  btn.addEventListener('click', async function () {
    if (!window.showDirectoryPicker) {
      status('このブラウザはフォルダの選択（File System Access API）に対応していません。Chrome か Edge で開いてください。', 'ng');
      return;
    }
    if (needPerm) {
      // 覚えていたフォルダの許可を取り直すだけ（フォルダを選び直さなくてよい）
      const saved = await idbGet('dir');
      if (saved && saved.requestPermission) {
        let st1 = 'denied';
        try { st1 = await saved.requestPermission({mode: 'read'}); } catch (e) { st1 = 'denied'; }
        if (st1 === 'granted') {
          dirHandle = saved; needPerm = false;
          btn.textContent = '📂 PC の Addata フォルダを選ぶ（C:\\Addata）';
          sentCom = false; sentCars.clear();
          await sendCom();
          return;
        }
      }
      needPerm = false;   // 許可が取れなければ、ふつうに選び直してもらう
    }
    try {
      dirHandle = await window.showDirectoryPicker({id: 'addata', mode: 'read'});
    } catch (e) { return; }   // キャンセル
    await idbPut('dir', dirHandle);          // 次に開いたときのために覚える
    lsSet(LS_NAME, dirHandle.name || '');
    sentCom = false; sentCars.clear();
    await sendCom();
  });

  async function restore() {
    // 覚えていた handle を出し、許可が残っていればそのまま使う（残っていなければボタン 1 回で復帰）
    const saved = await idbGet('dir');
    const name = lsGet(LS_NAME);
    if (saved && saved.queryPermission) {
      let st0 = 'prompt';
      try { st0 = await saved.queryPermission({mode: 'read'}); } catch (e) { st0 = 'prompt'; }
      if (st0 === 'granted') {
        dirHandle = saved;
      } else {
        needPerm = true;
        btn.textContent = '🔓 前回の Addata フォルダ（' + (saved.name || name || 'C:\\Addata') + '）を使う';
      }
    }
    // 送り先のフォルダ名と、PC 側のデータ版（COM/AnVer.DB。27 バイト）を Python に渡す。
    // アプリ側に前の取り込みが残っていて版も同じなら、送り直さずに続きができる。版が違えば引き継がれず、下で送り直す
    let anver = '';
    if (dirHandle) {
      try {
        const com = await dirHandle.getDirectoryHandle('COM');
        const fh = await com.getFileHandle('AnVer.DB');
        const r = await readFile(await fh.getFile());
        anver = r.b64;
      } catch (e) { anver = ''; }
    }
    status('前回の接続を確かめています…', 'busy');
    send({phase: 'hello', bridge_id: savedBid || lsGet(LS_BID), root_name: name, files: {}, bytes: 0, anver: anver,
          keep: {addata_dir: lsGet('neo_addata_dir'), addata_url: lsGet('neo_addata_url')}});
    helloSent = true;
  }

  window.addEventListener('message', async function (ev) {
    const d = ev.data || {};
    if (d.type !== 'streamlit:render') return;
    lastArgs = d.args || lastArgs;
    if (lastArgs.forget) { await forgetAll(); status('接続を解除しました。使うときは、もう一度フォルダを選んでください。', ''); setHeight(); return; }
    if (!helloSent) { savedBid = lsGet(LS_BID); await restore(); }
    // 覚えるのは COM が届いている接続だけ（空のフォルダの名前を覚えても、次に開いたとき何も引き継げない）
    if (lastArgs.bid && lastArgs.com) { lsSet(LS_BID, String(lastArgs.bid)); }
    const keep = lastArgs.keep || {};
    if (keep && typeof keep === 'object') { for (const k in keep) { lsSet('neo_' + k, String(keep[k] || '')); } }
    const want = (lastArgs.want || '').toString().trim();
    const have = lastArgs.have || [];
    if (!lastArgs.com && sentCom && !sending) {
      // サーバ側の取り込みが消えた（接続の解除・古いフォルダの掃除・別のセッション）: 送った印を戻し、選び直しを促す
      sentCom = false; sentCars.clear();
      status('アプリ側の接続が解除されました。使うには、もう一度ボタンで PC の Addata フォルダを選んでください。', 'ng');
    }
    if (!dirHandle && want) {
      // 画面を読み直すとフォルダの選択は消える（ブラウザの決まり）。読み取り結果はアプリ側に取り置かれているので、
      // ここで選び直せば車種フォルダだけ送って続きができる（読み直しは要らない）
      status(`車種 ${want} のフォルダが必要ですが、PC のフォルダの選択が消えています（画面を読み直したため）。上のボタンを 1 回押すと`
             + (needPerm ? '、前回のフォルダの許可を取り直して続きができます。' : '選び直せます。'), 'ng');
    }
    if (dirHandle && !lastArgs.com && !sentCom && !sending) {
      // フォルダは使えるのに、アプリ側に車種マスタが無い（掃除で消えた・版が変わって捨てた・初めて）:
      // 選び直してもらわずにそのまま送る
      await sendCom();
    }
    if (dirHandle) {
      if (lastArgs.com && !want) {
        status(`接続中: ${dirHandle.name}（COM 取り込み済み${have.length ? '。車種フォルダ: ' + have.join(', ') : ''}）。見積を入れて生成すると、必要な車種フォルダを自動で送ります。`, 'ok');
      }
      // 車種フォルダは、アプリ側が COM を受け取っている（com=true）ときだけ送る。COM の無いフォルダを選んだ直後に
      // 車種を探しに行くと「無い」の error になり、待ち（取り置き）を捨ててしまう（Codex 49）
      if (lastArgs.com && want && !have.includes(want) && !sentCars.has(want)) {
        await sendCar(want);
      }
    }
    setHeight();
  });

  post('streamlit:componentReady', {apiVersion: 1});
  setHeight();
})();
</script>
</body>
</html>
